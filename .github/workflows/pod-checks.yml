name: POD regression checks
on:
  pull_request:
  push:
    branches: [main, 'pod-ecommerce-hardening-*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: POD tests without network or credentials
        run: node scripts/pod/test-all.mjs
